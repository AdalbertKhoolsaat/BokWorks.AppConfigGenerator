name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.2.3)'
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  pack-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Src/BokWorks.AppConfigGenerator/BokWorks.AppConfigGenerator.csproj
      - name: Pack
        run: |
          VERSION=${{ inputs.version != '' && inputs.version || github.ref_name }}
          VERSION=${VERSION#v}
          dotnet pack Src/BokWorks.AppConfigGenerator/BokWorks.AppConfigGenerator.csproj -c Release -p:Version=$VERSION -o artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/AdalbertKhoolsaat/index.json" \
            --skip-duplicate