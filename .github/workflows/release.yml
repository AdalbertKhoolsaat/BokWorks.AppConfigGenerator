name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.2.3)'
        required: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  pack-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Src/BokWorks.AppConfigGenerator/BokWorks.AppConfigGenerator.csproj
      - name: Pack
        run: |
          VERSION=${{ inputs.version }}
          dotnet pack Src/BokWorks.AppConfigGenerator/BokWorks.AppConfigGenerator.csproj -c Release -p:Version=$VERSION -o artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nuget
          path: artifacts/*.nupkg
      - name: NuGet login (OIDC)
        uses: nuget/login@v1
        with:
          user: AdalbertKhoolsaat
      - name: Push to NuGet.org
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate