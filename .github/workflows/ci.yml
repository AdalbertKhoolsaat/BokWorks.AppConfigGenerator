name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Src/BokWorks.AppConfigGenerator.sln 
      - name: Build
        run: dotnet build Src/BokWorks.AppConfigGenerator.sln -v minimal
      # - name: Test
      #   run: dotnet test BokWorks.AppConfigGenerator.sln -v minimal